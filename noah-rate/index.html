</style></head><body><div class="wrap"><div id="login" class="card login"><h1>手机查价</h1><p class="muted">输入密码后加载查价数据。当前为快速模式，数据加载会比加密版快很多。</p><label>密码</label><input id="password" type="password" placeholder="请输入密码" autocomplete="current-password"><div style="height:10px"></div><button onclick="unlock()">进入查价</button><p id="loginMsg" class="muted"></p></div><div id="app" class="hidden"><div class="card"><div class="toolbar"><div style="flex:1"><h1>Noah 手机查价</h1><div id="meta" class="muted">正在加载数据…</div></div><button class="secondary" onclick="lock()">退出</button></div></div><div class="card"><h2>快速查价</h2><div class="grid"><div><label>目的地 / 仓库 / 邮编</label><input id="dest" placeholder="德国、ONT8、90011、美西"></div><div><label>重量 KG</label><input id="weight" type="number" step="0.1" min="0.1" placeholder="100"></div></div><div class="grid3"><div><label>运输方式</label><select id="mainline"><option value="">全部</option><option value="SEA">海运</option><option value="AIR">空运</option><option value="RAIL">铁路</option><option value="TRUCK_AIR">卡航</option></select></div><div><label>线路关键词</label><input id="keyword" placeholder="正班、加班、EXX、带电"></div></div><div style="height:10px"></div><button onclick="runQuery()">开始查价</button><div class="summary" id="interpretation">输入目的地和重量后查价。</div></div><div class="card"><h2>查询结果</h2><div id="summary" class="summary">暂无结果。</div><div id="results"></div></div></div></div><script>
const PASSWORD_HASH='a665a45920422f9d417e4867efdc4fb8a04a1f3fff1fa07e998e86f7f7a27ae3';
const DATA_VERSION='c97ccde96b81f0b5100b34898f92649b88a43139f76dc5fe0080a42d9b29602e';
const LABELS={mainline:{SEA:'海运',AIR:'空运',RAIL:'铁路',TRUCK_AIR:'卡航'},tax:{TAX_INCLUDED:'包税',SELF_TAX:'自税 / 递延'},region:{WEST:'美西',CENTRAL:'美中',EAST:'美东'},service:{MATSON_REGULAR:'美森正班',MATSON_OVERTIME:'美森加班',FAST_SHIP:'快船',REGULAR_SHIP:'普船',STANDARD:'标准',EXPRESS:'快速',ECONOMY:'经济'},route:{DIRECT:'直航 / 直飞',US_TRANSFER:'美转加',SEA_AIR:'海空联运'}};
const REGION_BOUNDS={EAST:[0,39999],CENTRAL:[40000,79999],WEST:[80000,99999]};let DATA=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function unlock(){try{$('loginMsg').textContent='正在加载数据…';const password=$('password').value;if(await sha256(password)!==PASSWORD_HASH)throw new Error('密码不正确。');DATA=await fetch(`rates.json?v=${encodeURIComponent(DATA_VERSION)}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('找不到 rates.json，请确认已经同步到 GitHub。');return r.json()});if(Array.isArray(DATA.fields)&&Array.isArray(DATA.records)&&Array.isArray(DATA.records[0])){const fs=DATA.fields;DATA.records=DATA.records.map(row=>{const o={};for(let i=0;i<fs.length;i++)o[fs[i]]=row[i];return o})}sessionStorage.setItem('price-password-ok','1');$('login').classList.add('hidden');$('app').classList.remove('hidden');$('meta').textContent=`数据更新时间：${DATA.generated_at||'—'} · 最新价格日期：${String(DATA.latest_effective_at||'—').slice(0,10)} · ${DATA.record_count||0} 条当前价格`;['dest','weight','keyword'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')runQuery()}));$('loginMsg').textContent=''}catch(e){$('loginMsg').textContent=e.message||String(e)}}
function lock(){DATA=null;sessionStorage.removeItem('price-password-ok');$('app').classList.add('hidden');$('login').classList.remove('hidden');$('password').value=''}
function detectDestination(raw){let s=String(raw||'').trim().toUpperCase();if(!s)return {kind:'UNKNOWN'};if(/^\d{5}$/.test(s)){const z=Number(s),first=s[0];return {kind:'ZIP',zipcode:z,us_region:first>='8'?'WEST':first>='4'?'CENTRAL':'EAST',text:`美国邮编 ${s}`}};if(['美西','US WEST','WEST'].includes(raw.trim())||s==='美西')return {kind:'REGION',us_region:'WEST',text:'美西'};if(['美中','US CENTRAL','CENTRAL'].includes(raw.trim())||s==='美中')return {kind:'REGION',us_region:'CENTRAL',text:'美中'};if(['美东','US EAST','EAST'].includes(raw.trim())||s==='美东')return {kind:'REGION',us_region:'EAST',text:'美东'};if(/^[A-Z]{2,6}\d[A-Z0-9]{0,5}$/.test(s)||/^[A-Z]{4}$/.test(s))return {kind:'WAREHOUSE',warehouse_code:s,text:`FBA 仓库 ${s}`};const countries={'德国':'DE','DE':'DE','GERMANY':'DE','法国':'FR','FRANCE':'FR','FR':'FR','意大利':'IT','ITALY':'IT','IT':'IT','西班牙':'ES','SPAIN':'ES','ES':'ES','英国':'GB','UK':'GB','GB':'GB','UNITED KINGDOM':'GB','罗马尼亚':'RO','RO':'RO','荷兰':'NL','NL':'NL','NETHERLANDS':'NL','比利时':'BE','BE':'BE','波兰':'PL','PL':'PL','捷克':'CZ','CZ':'CZ','美国':'US','USA':'US','US':'US','加拿大':'CA','CANADA':'CA','CA':'CA'};if(countries[s]||countries[raw.trim()])return {kind:'COUNTRY',country_code:countries[s]||countries[raw.trim()],text:raw.trim()};return {kind:'UNKNOWN',text:raw.trim()}}
function matchDest(r,d){if(d.kind==='WAREHOUSE'){const w=String(r.warehouse_code||'').toUpperCase();return w===d.warehouse_code||(w.endsWith('*')&&d.warehouse_code.startsWith(w.slice(0,-1)))}if(d.kind==='ZIP'){if(r.zip_start!=null&&r.zip_end!=null)return Number(r.zip_start)<=d.zipcode&&Number(r.zip_end)>=d.zipcode;return (!r.zip_start&&!r.zip_end)&&(r.us_region===d.us_region||(r.country_code==='US'&&!r.us_region))}if(d.kind==='REGION'){const b=REGION_BOUNDS[d.us_region];if(r.zip_start!=null&&r.zip_end!=null)return Number(r.zip_start)<=b[1]&&Number(r.zip_end)>=b[0];return (!r.zip_start&&!r.zip_end)&&(r.us_region===d.us_region||(r.country_code==='US'&&!r.us_region))}if(d.kind==='COUNTRY'){if(d.country_code==='US')return r.country_code==='US'&&!r.zip_start&&!r.zip_end;return String(r.country_code||'').toUpperCase()===d.country_code}return false}
function matchWeight(r,w){const ceil=Math.ceil(w);if((r.record_type||'PRICE_PER_KG')==='FIXED_TOTAL_BY_WEIGHT')return Number(r.weight_threshold)>=w;if(r.weight_upper_bound!=null&&r.weight_upper_bound!==''){const lo=Number(r.weight_threshold),hi=Number(r.weight_upper_bound),inc=Number(r.weight_upper_inclusive)!==0;return lo<=ceil&&(inc?ceil<=hi:ceil<hi)}return Number(r.weight_threshold)<=ceil}
function keywordTokens(s){return String(s||'').toUpperCase().split(/[\s,，、]+/).map(x=>x.trim()).filter(Boolean)}
function matchKeyword(r,tokens){if(!tokens.length)return true;const text=String([r.channel_label,r.service_level,r.lead_time,r.remarks,r.source_filename,r.sheet_name].join(' ')).toUpperCase();return tokens.every(t=>{const vs=t==='带电'?['带电','内电']:t==='正班'?['正班','MATSON_REGULAR']:t==='加班'?['加班','MATSON_OVERTIME']:[t];return vs.some(v=>text.includes(String(v).toUpperCase()))})}
function weightText(r){if(r.record_type==='FIXED_TOTAL_BY_WEIGHT')return `≤ ${r.weight_threshold}KG`;if(r.weight_label)return r.weight_label;if(r.weight_upper_bound!=null&&r.weight_upper_bound!=='')return `${r.weight_threshold}-${r.weight_upper_bound}KG`;return `${r.weight_threshold}KG+`}
function destinationText(r){return r.warehouse_code||(r.zip_label?`邮编 ${r.zip_label}`:'')||(LABELS.region[r.us_region])||r.country_code||r.entity_display||'—'}
function quoteNumber(v){const n=Number(v);return Number.isFinite(n)?String(Number(n.toPrecision(12))):String(v??'—')}
function priceText(r){return r.record_type==='FIXED_TOTAL_BY_WEIGHT'?`${quoteNumber(r.price)} RMB 总价`:`${quoteNumber(r.price)} RMB/KG`}
function selectMatchedOffers(rows,d){
 const groups=new Map(),base=r=>[r.supplier_name,r.source_filename,r.sheet_name,r.block_key,r.country_code,r.us_region,r.origin_scope,r.mainline,r.tax_type,r.service_level,r.route_type,r.volume_divisor,r.channel_label,r.last_mile,r.address_type,r.record_type,r.billing_unit];
 const priority=r=>[d.kind==='WAREHOUSE'&&r.warehouse_code===d.warehouse_code?2:0,r.zip_start!=null&&r.zip_end!=null?1:0,-(r.zip_start!=null?Number(r.zip_end)-Number(r.zip_start):999999),r.record_type==='FIXED_TOTAL_BY_WEIGHT'?0:(r.weight_upper_bound!=null?2:1),r.record_type==='FIXED_TOTAL_BY_WEIGHT'?-Number(r.weight_threshold):Number(r.weight_threshold),Number(r.id||0)];
 const better=(a,b)=>{const x=priority(a),y=priority(b);for(let i=0;i<x.length;i++){if(x[i]!==y[i])return x[i]>y[i]}return false};
 const exact=new Set(rows.filter(r=>d.kind==='WAREHOUSE'&&r.warehouse_code===d.warehouse_code).map(r=>JSON.stringify(base(r))));
 for(const r of rows){
  if(d.kind==='WAREHOUSE'&&String(r.warehouse_code||'').endsWith('*')&&exact.has(JSON.stringify(base(r))))continue;
  const key=JSON.stringify([...base(r),r.offer_key||'',d.kind==='WAREHOUSE'?'':r.warehouse_code,d.kind==='REGION'?r.zip_start:'',d.kind==='REGION'?r.zip_end:'']);
  if(!groups.has(key)||better(r,groups.get(key)))groups.set(key,r);
 }
 return [...groups.values()];
}
function lookupUpsRemoteZip(d){if(!DATA||d.kind!=='ZIP'||!DATA.ups_remote_zip)return null;const z=String(d.zipcode).padStart(5,'0'),info=DATA.ups_remote_zip||{};if((info.extended||[]).includes(z))return {zipcode:z,label:info.extended_label||'UPS超偏远',message:`邮编 ${z} 属于 UPS 超偏远邮编，报价时需要额外确认偏远附加费。`};if((info.normal||[]).includes(z))return {zipcode:z,label:info.normal_label||'UPS正常偏远',message:`邮编 ${z} 属于 UPS 正常偏远邮编，报价时需要额外确认偏远附加费。`};return null}
function remoteZipHtml(info){return info?`<div class="result warn"><b>UPS 偏远提示：</b>${esc(info.message)}<br><span class="muted">这里只提示偏远属性，不自动加收费用。</span></div>`:''}
function runQuery(){try{if(!DATA)throw new Error('请先输入密码。');const d=detectDestination($('dest').value),w=Number($('weight').value||0);if(d.kind==='UNKNOWN')throw new Error('无法识别目的地，请输入国家、美区、邮编或 FBA 仓库代码。');if(!w||w<=0)throw new Error('请输入重量。');const main=$('mainline').value,tokens=keywordTokens($('keyword').value),remote=lookupUpsRemoteZip(d),remoteHtml=remoteZipHtml(remote);$('interpretation').textContent=`已识别：${d.text||$('dest').value} · ${w}KG${remote?` · ${remote.label}`:''}`;let rows=(DATA.records||[]).filter(r=>matchDest(r,d)&&matchWeight(r,w)&&(!main||r.mainline===main)&&matchKeyword(r,tokens));rows=selectMatchedOffers(rows,d);rows.sort((a,b)=>Number(a.price)-Number(b.price));rows=rows.slice(0,80);$('summary').textContent=`找到 ${rows.length} 条匹配线路。${remote?` · ${remote.label}`:''}`;if(!rows.length){$('results').innerHTML=remoteHtml+'<div class="result warn">没有匹配结果。可以取消运输方式或关键词再试。</div>';return}$('results').innerHTML=remoteHtml+rows.map(r=>`<div class="result"><div class="result-top"><div><div class="supplier">${esc(r.supplier_name)}</div><div class="muted">${esc(destinationText(r))} · ${esc(LABELS.mainline[r.mainline]||r.mainline||'—')} · ${esc(r.channel_label||'—')}</div></div><div class="price ${r.record_type==='FIXED_TOTAL_BY_WEIGHT'?'fixed':''}">${esc(priceText(r))}</div></div><div class="tags"><span class="tag">${esc(weightText(r))}</span><span class="tag">${esc(r.market==='US'?'美国':(LABELS.tax[r.tax_type]||r.tax_type||'未标注'))}</span><span class="tag">${esc(r.last_mile==='TRUCK'?'卡派':'快递派')}</span>${remote&&r.last_mile!=='TRUCK'?`<span class="tag">${esc(remote.label)}</span>`:''}${r.service_level?`<span class="tag">${esc(LABELS.service[r.service_level]||r.service_level)}</span>`:''}</div><div class="detail">${r.offer_conditions?esc(String(r.offer_conditions).slice(0,160))+'<br>':''}时效：${esc(r.lead_time||'—')}<br>来源：${esc(r.source_filename||'—')} / ${esc(r.sheet_name||'—')} / ${esc(r.price_cell||'')}<br>更新时间：${esc(String(r.source_modified_at||r.created_at||'').slice(0,10)||'—')}</div></div>`).join('')}catch(e){$('summary').textContent='查询失败';$('results').innerHTML=`<div class="result error">${esc(e.message||String(e))}</div>`}}
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
</script><script>// Pure AU evaluator. The static phone page uses exactly this reviewed snapshot.
const AustraliaQuotes = (() => {
  const isCountry = s => ['澳大利亚','澳洲','AU','AUSTRALIA'].includes(String(s||'').trim().toUpperCase());
  const has = (items,z) => (items||[]).some(([a,b])=>a<=Number(z)&&Number(z)<=b);
  const ceil = (w,s) => Math.ceil(w*(1/s))*s;
  function evaluate(r,z,w,p=1) {
    if(!has(r.ranges,z)||has(r.exclude_ranges,z)||w<r.min_weight||(r.max_weight!=null&&w>r.max_weight)||(r.single_piece&&p!==1))return null;
    if(has(r.blocked,z))return {blocked:true,supplier_name:r.supplier_name,channel_label:r.channel_label,reason:'原表注明无服务/无法派送，请单独确认，不提供有效报价。'};
    const q={...r},warnings=[];delete q.blocked;let charge=r.round_step?ceil(w,r.round_step):w,base,price=null;
    const f=r.first;if(f&&charge<f.until)charge=ceil(charge,f.step);
    const eligible=r.tiers.filter(t=>t.weight<=charge&&(t.upper==null||charge<=t.upper));
    if(f&&charge<f.until){if(p!==1)return null;charge=ceil(charge,f.step);const n=Math.round(charge/f.step);base=f.price+Math.max(0,n-1)*f.next;q.price_cell=f.cell;q.weight_label=`首${f.step}KG + 续${f.step}KG`;q.calculation=`首重 ${f.price} + ${Math.max(0,n-1)} × 续重 ${f.next}`;}
    else if(eligible.length){const t=eligible.reduce((a,b)=>a.weight>b.weight?a:b);price=t.price;base=charge*price;q.price_cell=t.price_cell;q.weight_source_cell=t.weight_source_cell;q.weight_label=t.weight_label;q.calculation=`${charge}KG × ${price}元/KG`;}
    else return null;
    const fees=[];let rmb=0;
    for(const f of r.fees){const amount=f.fee*(f.unit==='piece'?p:1);fees.push({...f,amount});rmb+=amount;}
    const matched=r.remote.filter(f=>has(f.ranges,z));
    if(matched.length>1)warnings.push('邮编命中多个偏远费规则，需要核对原表；偏远费未合入。');
    else if(matched.length){const f=matched[0];if(f.weight_fees){if(p!==1)warnings.push('超偏远费按件和每件计费重收取；多件须按箱规核算，未合入。');else{const band=f.weight_fees.find(b=>charge<=b.max);if(band)fees.push({...f,amount:band.fee,cell:band.cell});else warnings.push(`超过22KG的澳币偏远费含基础费 ${f.above22_base} 和每KG ${f.above22_perkg}；计法需确认，未合入。`);}}else{const amount=f.fee*(f.unit==='piece'?p:f.unit==='kg'?charge:1);fees.push({...f,amount});rmb+=amount;}}
    if(r.remote_review)warnings.push('原表偏远/派送清单可能不完整，未命中不代表非偏远；出货前确认。');
    warnings.push('基础运费测算，不是全包结算价；品名、尺寸、税金、超长超重等按原表另核。');
    return {...q,price,base_freight:Math.round(base*10000)/10000,total_rmb:Math.round((base+rmb)*10000)/10000,fees,chargeable_weight:charge,postcode:z,warnings,record_type:'AU_POSTCODE',billing_unit:price==null?'TOTAL':'KG'};
  }
  function query(data,f){
    const z=String(f.postcode||'').trim(),w=Number(f.weight),p=Number(f.pieces==null||f.pieces===''?1:f.pieces);
    if(!/^\d{4}$/.test(z))throw Error('澳大利亚邮编必须是四位数字，例如 2000、0800；请保留前面的零。');
    if(!Number.isFinite(w)||w<=0)throw Error('请输入正数计费重量。');
    if(!Number.isInteger(p)||p<1||p>10000)throw Error('件数必须是正整数。');
    const records=[],blocked_routes=[],words=String(f.keyword||'').trim().toUpperCase().split(/[\s,，]+/);
    for(const raw of data?.records||[]){const r={...raw};if(data.shared)for(const key of ['ranges','remote','blocked','notes'])r[key]=data.shared[r[key+'_ref']];if(f.supplier_names?.length&&!f.supplier_names.includes(r.supplier_name))continue;if(f.mainline&&f.mainline!==r.mainline||f.tax_type&&f.tax_type!==r.tax_type)continue;if(words.some(t=>t&&!r.channel_label.toUpperCase().includes(t)))continue;const q=evaluate(r,z,w,p);if(q)(q.blocked?blocked_routes:records).push(q);}
    const taxRank=r=>r.tax_type==='TAX_INCLUDED'?0:r.tax_type==='SELF_TAX'?1:2;
    records.sort((a,b)=>taxRank(a)-taxRank(b)||a.total_rmb-b.total_rmb||a.supplier_name.localeCompare(b.supplier_name)||a.channel_label.localeCompare(b.channel_label));
    return {australia:true,records:records.slice(0,80),blocked_routes,filters:f,interpretation:`澳大利亚 · 邮编 ${z} · 普通/私人地址 · ${w}KG计费重 / ${p}件；按供应商自己的分区匹配。`};
  }
  return {isCountry,evaluate,query};
})();
if(typeof module!=='undefined')module.exports=AustraliaQuotes;

// AU-only extension; the existing mobile queries remain unchanged.
const originalMobileRunQuery=runQuery;
runQuery=function(){if(!AustraliaQuotes.isCountry($('dest').value))return originalMobileRunQuery();try{if(!DATA)throw Error('请先输入密码。');const d=AustraliaQuotes.query(DATA.australia,{postcode:$('auPostcode').value.trim(),weight:$('weight').value,pieces:$('auPieces').value,mainline:$('mainline').value,keyword:$('keyword').value});$('interpretation').textContent=d.interpretation;$('summary').textContent=`${d.records.length} 条澳洲邮编线路，含税优先，同类按人民币总价排序；不含另收澳币等费用。`;$('results').innerHTML=d.records.map(r=>`<div class="result"><b>${esc(r.supplier_name)} · ${esc(r.channel_label)}</b><p>${esc(r.entity_display)} · ${esc(r.weight_label)} · ${esc(r.tax_type==='TAX_INCLUDED'?'含税':r.tax_type==='SELF_TAX'?'不含税':'税务未标注')}</p><div class="price">${esc(r.total_rmb)} RMB 总价</div><div class="detail">${esc(r.lead_time||'')}<br>${esc(r.source_filename)} / ${esc(r.sheet_name)} / ${esc(r.price_cell)}</div></div>`).join('')+(!d.records.length?'<div class="result warn">没有适用报价；请检查邮编、计费重量与运输方式。FBA/按方/到港报价不混入邮编结果。</div>':'');}catch(e){$('summary').textContent='查询失败';$('results').innerHTML=`<div class="result error">${esc(e.message)}</div>`;}};
const auFields=document.createElement('div');auFields.id='auFields';auFields.className='grid3 hidden';auFields.innerHTML='<div><label>澳大利亚邮编（四位）</label><input id="auPostcode" type="text" inputmode="numeric" maxlength="4" placeholder="例如 2000、0800"></div><div><label>件数</label><input id="auPieces" type="number" min="1" step="1" value="1"></div>';
$('dest').closest('.grid').after(auFields);
const syncAu=()=>{const au=AustraliaQuotes.isCountry($('dest').value);auFields.classList.toggle('hidden',!au);if(au)$('interpretation').textContent='澳大利亚：请输入四位邮编，再输入计费重量。';};
$('dest').addEventListener('input',syncAu);$('dest').addEventListener('change',syncAu);$('auPostcode').addEventListener('keydown',e=>{if(e.key==='Enter')runQuery();});
</script></body></html>
